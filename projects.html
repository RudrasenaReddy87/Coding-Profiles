<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects Portfolio</title>
    <link rel="stylesheet" href="projects.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.263.1/font/lucide.css">
</head>
<body>
    <div class="particles-container" id="particles-js"></div>
    
    <!-- Background gradient elements -->
    <div class="bg-gradient-1"></div>
    <div class="bg-gradient-2"></div>
    
    <header>
        <div class="header-content">
            <div class="title-wrapper">
                <h1 class="main-title">My Projects</h1>
                <div class="title-underline"></div>
            </div>
            <p class="subtitle">Explore some of my recent projects on GitHub</p>
        </div>
    </header>

    <div class="controls">
        <a href="https://github.com/RudrasenaReddy87" target="_blank" class="btn github-btn">
            <i class="fab fa-github"></i> My GitHub
        </a>
        
        <div class="sort-container">
            <label for="sort">Sort by:</label>
            <select id="sort">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="modified">Recently Modified</option>
                <option value="name">Project Name</option>
            </select>
        </div>
        
        <button id="color-cycle-btn" class="btn color-cycle-btn">
            <i class="fas fa-palette"></i> Cycle Colors
        </button>
    </div>

    <section class="projects-container" id="projects-container">
        <!-- Projects will be loaded dynamically -->
    </section>

    <footer>
    <p>For more projects, kindly visit my GitHub | &copy; 2025</p>
    <div class="footer-links">
        <a href="https://github.com/RudrasenaReddy87" target="_blank">
            <i class="fab fa-github"></i> GitHub Profile
        </a>
    </div>
</footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="project_script.js"></script>
</body>
</html>
